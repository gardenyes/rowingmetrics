# Codemagic config — Flutter app lives in flutter_app/ (not repo root).
# https://docs.codemagic.io/yaml-code-signing/signing-ios/
#
# iOS signing uses App Store Connect API (automatic), not uploaded profiles.
# Before building, in Codemagic:
# 1) Team settings → Integrations → Developer Portal: add an App Store Connect API key
#    and set integrations.app_store_connect below to that key's name.
# 2) App → Environment variables: add secret CERTIFICATE_PRIVATE_KEY (RSA private key
#    for iOS Distribution) in a group named code_signing.
# 3) In Apple Developer, ensure App ID com.gardenyes.rowingMetrics exists.

workflows:
  ios-workflow:
    name: iOS
    working_directory: flutter_app
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the API key name in Codemagic → Team settings → Developer Portal
      app_store_connect: App Store Connect
    environment:
      groups:
        - code_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.gardenyes.rowingMetrics
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  android-workflow:
    name: Android
    working_directory: flutter_app
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
